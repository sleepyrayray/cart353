<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Garden</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/libraries/p5.min.js" defer></script>
    <!-- p5.sound.min.js is kept in js/libraries for when sound is added. -->
    <script src="js/physics.js" defer></script>
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header class="intro">
      <h1>Star Garden</h1>
      <p>Watch worlds grow around a Sun-like star.</p>
    </header>
    <div class="sidebar">
      <section class="controls" aria-label="Simulation playback">
        <div class="playback">
          <button id="play" type="button">Play</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="reset" type="button">Reset</button>
        </div>
        <p class="elapsed-time">Time: <span id="elapsed-time" role="timer" aria-live="off">0:00</span></p>
      </section>
      <section id="planet-info" class="planet-info" aria-labelledby="planet-info-title" hidden>
        <h2 id="planet-info-title">Your planet</h2>
        <dl>
          <div><dt>Distance from star</dt><dd id="planet-distance"></dd></div>
          <div><dt>Year length</dt><dd id="planet-year"></dd></div>
        </dl>
      </section>
    </div>
    <main id="space" aria-label="Star Garden simulation"></main>
  </body>
</html>
